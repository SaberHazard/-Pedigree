<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>کمی صبر کنید</title>
<style>
:root { color-scheme: light dark; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Vazirmatn, Tahoma, sans-serif; background: #f6f4ef; color: #243034; padding: 16px; box-sizing: border-box; }
.box { max-width: 420px; text-align: center; background: #fff; border-radius: 20px; padding: 28px 22px; box-shadow: 0 20px 50px -25px rgba(0,0,0,.35); }
h1 { font-size: 1.2rem; margin: 0 0 10px; }
p { line-height: 1.9; margin: 0 0 16px; color: #5b6b6f; }
a { display: inline-block; background: #3f9589; color: #fff; text-decoration: none; padding: 9px 22px; border-radius: 12px; }
@media (prefers-color-scheme: dark) { body { background: #111a1c; color: #e4eeee; } .box { background: #182427; } p { color: #9fb0b2; } }
</style>
</head>
<body>
<div class="box">
  <h1>سایت چند لحظه در دسترس نیست</h1>
  <p>در حال به‌روزرسانی یا رفع یک مشکل موقت هستیم. لطفاً یک دقیقه دیگر دوباره امتحان کنید.</p>
  <a href="/">تلاش دوباره</a>
</div>
</body>
</html>
