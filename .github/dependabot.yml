# به‌روزرسانی خودکار وابستگی‌ها (به‌ویژه وصله‌های امنیتی)
version: 2
updates:
  - package-ecosystem: composer
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      laravel:
        patterns: ["laravel/*", "symfony/*"]
  - package-ecosystem: gradle
    directory: /mobile/android
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
